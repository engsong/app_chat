# ==============================================================================
# Domain: chat.on-excapp.app (WhatsApp Business Web & WebRTC Application)
# High-Security Host Reverse Proxy with Anti-DDoS, Rate Limiting & WebSockets
# ==============================================================================

# Upstream definitions
upstream whatsapp_backend_upstream {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream whatsapp_frontend_upstream {
    server 127.0.0.1:5174;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - ACME Challenge & Permanent 301 HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name chat.on-excapp.app;

    # Let's Encrypt / Certbot Verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - High-Security Production Reverse Proxy with Anti-DDoS
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.on-excapp.app;

    # SSL Certificate & Private Key (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/chat.on-excapp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.on-excapp.app/privkey.pem;

    # TLS Protocols & Ciphers (Grade A+ Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ==========================================================================
    # Global Security Headers (OWASP Top 10 Hardening)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Required for WebRTC 1-on-1 and Group Audio/Video Calling
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # ==========================================================================
    # Anti-DDoS: Connection & Rate Limiting (using zones from security.conf)
    # ==========================================================================
    limit_conn conn_limit 25;

    # Block Automated Vulnerability Scanners & Bad Bots
    if ($bad_bot) {
        return 403;
    }

    # Block sensitive system and git/env files
    location ~* /\.(git|env|htaccess|svn|hg) {
        deny all;
        return 404;
    }

    # Block php / probe attempts
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        return 404;
    }

    # ==========================================================================
    # 1. Real-Time WebSockets & WebRTC Signaling
    # ==========================================================================
    location /socket.io/ {
        proxy_pass http://whatsapp_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for real-time chat and long audio/video calls
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ==========================================================================
    # 2. REST API Endpoints with Anti-DDoS Rate Limiting
    # ==========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://whatsapp_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Dedicated auth rate limit for login to prevent brute-forcing
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://whatsapp_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct download for Android APK
    location /download/ {
        alias /var/www/chat-app/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
    }

    # ==========================================================================
    # 3. React Frontend Single Page Application
    # ==========================================================================
    location / {
        proxy_pass http://whatsapp_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
