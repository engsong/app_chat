# Upstream definitions
upstream backend_upstream {
    server backend:5000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

# -------------------------------------------------------------
# 1. HTTP Server (Port 80) - ACME challenge & HTTPS Redirect
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name chat.on-excapp.app;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS (or proxy temporarily if SSL not installed yet)
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------
# 2. HTTPS Server (Port 443) - Hardened Security & Anti-DDoS
# -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.on-excapp.app;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/chat.on-excapp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.on-excapp.app/privkey.pem;

    # SSL Protocols & Ciphers (Modern A+ Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ==========================================
    # Global Security Headers (OWASP Hardening)
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Camera & Microphone permissions needed for WebRTC Audio & Video calls
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # ==========================================
    # Anti-DDoS: Connection & Rate Limiting
    # ==========================================
    limit_conn conn_limit 25;                  # Max 25 simultaneous connections per IP
    limit_req zone=general_limit burst=30 nodelay;

    # ==========================================
    # Exploit & Scanner Blocker
    # ==========================================
    # Block common malicious crawlers and automated vulnerability scanners
    if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|wpscan|acunetix|dirbuster|havij|zgrab|censys|shodan)) {
        return 403;
    }

    # Block sensitive system and git/env files
    location ~* /\.(git|env|htaccess|svn|hg) {
        deny all;
        return 404;
    }

    # Block php / wp probe attempts
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        return 404;
    }

    # ==========================================
    # 1. Real-Time WebSockets & WebRTC Signaling
    # ==========================================
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebRTC connection alive for calls
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ==========================================
    # 2. REST API Endpoints
    # ==========================================
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Dedicated auth rate limit for login to prevent brute-forcing
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 3. Frontend Single Page Application
    # ==========================================
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
