<!doctype html>
<html lang="en" class="dark" style="background-color: #111b21;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#202c33" />
    <title>IChat - Ultra-Fast Real-Time Messenger</title>
    <style>
      html, body {
        background-color: #111b21 !important;
        color: #e9edef;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        user-select: none;
      }
    </style>
  </head>
  <body class="bg-[#111b21] text-[#e9edef] overflow-hidden select-none fixed inset-0 h-full w-full" style="background-color: #111b21;">
    <div id="root" class="h-full w-full overflow-hidden">
      <!-- Dark IChat Splash Screen (shown during initial 0ms load or offline boot) -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background-color:#111b21;color:#8696a0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <img src="/logo.png" alt="IChat" style="width:72px;height:72px;border-radius:50%;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,0.5);" />
        <div style="font-size:18px;font-weight:600;color:#e9edef;margin-bottom:6px;">IChat</div>
        <div style="font-size:12px;color:#8696a0;">Loading conversations...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
