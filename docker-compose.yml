version: '3.8'

services:
  # ---------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------
  whatsapp_postgres:
    image: postgres:17-alpine
    container_name: whatsapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretDBPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_business}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_net

  # ---------------------------------------------
  # 2. Node.js Backend API & WebRTC Signaling
  # ---------------------------------------------
  whatsapp_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    restart: always
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SuperSecretDBPass2026!}@whatsapp_postgres:5432/${POSTGRES_DB:-whatsapp_business}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ultra_secure_whatsapp_jwt_token_2026_super_key}
      CLIENT_URL: https://chat.on-excapp.app
    depends_on:
      whatsapp_postgres:
        condition: service_healthy
    networks:
      - whatsapp_net

  # ---------------------------------------------
  # 3. React Frontend Web Application (Nginx SPA)
  # ---------------------------------------------
  whatsapp_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    restart: always
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - whatsapp_net

networks:
  whatsapp_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
