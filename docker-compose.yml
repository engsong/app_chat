version: '3.8'

services:
  # ---------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: whatsapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretDBPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_business}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ---------------------------------------------
  # 2. Node.js Backend & WebRTC Signaling
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SuperSecretDBPass2026!}@postgres:5432/${POSTGRES_DB:-whatsapp_business}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ultra_secure_whatsapp_jwt_token_2026_super_key}
      CLIENT_URL: https://chat.on-excapp.app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------
  # 3. React Frontend Web Application
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    restart: always
    networks:
      - app-network

  # ---------------------------------------------
  # 4. Nginx Reverse Proxy with Anti-DDoS
  # ---------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: whatsapp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  # ---------------------------------------------
  # 5. Let's Encrypt SSL Certbot Auto-Renewal
  # ---------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: whatsapp_certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
