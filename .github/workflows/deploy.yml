name: 🚀 Auto Deploy to Cloud Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '150.95.30.215' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || 'Changeme1!2@' }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            cd /var/www/chat-app
            git fetch --all
            git reset --hard origin/main
            chmod +x ./deploy.sh
            bash ./deploy.sh
