name: 🚀 Auto Deploy to Cloud Server

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Execute Remote SSH Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          HOST="${SERVER_HOST:-150.95.30.215}"
          USER="${SERVER_USER:-root}"
          PASS="${SERVER_PASSWORD:-Changeme1!2@}"
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 "${USER}@${HOST}" << 'EOF'
            set -e
            echo "🚀 Connecting to server..."
            cd /var/www/chat-app
            git fetch --all
            git reset --hard origin/main
            chmod +x ./deploy.sh
            bash ./deploy.sh
          EOF

  build-apk:
    name: 📱 Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Build Web App & Sync Capacitor
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: 🔨 Build Android APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ichat-app.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Publish APK to Server for Direct Download
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          HOST="${SERVER_HOST:-150.95.30.215}"
          USER="${SERVER_USER:-root}"
          PASS="${SERVER_PASSWORD:-Changeme1!2@}"
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${USER}@${HOST}" "mkdir -p /var/www/chat-app/downloads"
          sshpass -p "$PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null frontend/android/app/build/outputs/apk/debug/app-debug.apk "${USER}@${HOST}:/var/www/chat-app/downloads/ichat.apk"
          echo "🎉 APK published to https://chat.on-excapp.app/download/ichat.apk"
