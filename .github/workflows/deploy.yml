name: 🚀 Auto Deploy to Cloud Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            echo "=========================================="
            echo "🚀 Starting Automated Deployment on Server"
            echo "=========================================="

            APP_DIR="/var/www/chat-app"

            # Create directory if it does not exist
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Creating application directory: $APP_DIR"
              mkdir -p "$APP_DIR"
              cd "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git .
            else
              cd "$APP_DIR"
              echo "📥 Pulling latest updates from GitHub..."
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Ensure nginx certbot directories exist
            mkdir -p ./nginx/certbot/conf ./nginx/certbot/www

            echo "🐳 Building and starting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "🧹 Cleaning up old dangling Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
            docker compose ps
