name: 🚀 Auto Deploy to Cloud Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '150.95.30.215' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || 'Changeme1!2@' }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            echo "=========================================="
            echo "🚀 Starting Automated Deployment on Server"
            echo "=========================================="

            APP_DIR="/var/www/chat-app"

            # Create directory if it does not exist
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📁 Creating and cloning application repository into: $APP_DIR"
              mkdir -p "$APP_DIR"
              rm -rf "$APP_DIR"/* "$APP_DIR"/.[!.]*
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              echo "📥 Pulling latest updates from GitHub..."
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Update Host Nginx Configuration if changed
            if [ -f "./nginx/chat.on-excapp.app.conf" ]; then
              echo "🛡️ Updating Nginx Anti-DDoS Configuration..."
              cp ./nginx/chat.on-excapp.app.conf /etc/nginx/sites-available/chat.on-excapp.app.conf
              ln -sf /etc/nginx/sites-available/chat.on-excapp.app.conf /etc/nginx/sites-enabled/
              nginx -t && systemctl reload nginx || true
            fi

            echo "🐳 Building and starting Docker containers..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
            docker compose ps
