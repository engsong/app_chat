name: 🚀 Auto Deploy to Cloud Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Execute Remote SSH Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          HOST="${SERVER_HOST:-150.95.30.215}"
          USER="${SERVER_USER:-root}"
          PASS="${SERVER_PASSWORD:-Changeme1!2@}"
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 "${USER}@${HOST}" << 'EOF'
            set -e
            echo "🚀 Connecting to server..."
            cd /var/www/chat-app
            git fetch --all
            git reset --hard origin/main
            chmod +x ./deploy.sh
            bash ./deploy.sh
          EOF

  build-apk:
    name: 📱 Build & Publish Android APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools cmdline-tools;latest'

      - name: 🔑 Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Build Web App & Sync Capacitor
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: 🔨 Build Android APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.log || {
            echo "⚠️ First Gradle build attempt failed. Retrying with --refresh-dependencies..."
            sleep 2
            ./gradlew assembleDebug -x lint --no-daemon --refresh-dependencies --stacktrace 2>&1 | tee /tmp/gradle_output.log || {
              echo "## ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 120 /tmp/gradle_output.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }
          }

      - name: 📋 Upload Gradle Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: /tmp/gradle_output.log

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ichat-app.apk
          path: frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 🚀 Publish APK to Server for Direct Download
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq sshpass rsync || true
          HOST="${SERVER_HOST:-150.95.30.215}"
          USER="${SERVER_USER:-root}"
          PASS="${SERVER_PASSWORD:-Changeme1!2@}"
          export SSHPASS="$PASS"
          
          echo "Finding generated APK file..."
          APK_PATH=$(find frontend/android -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found in frontend/android!"
            find frontend/android/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          
          echo "Creating downloads directory on $HOST..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${USER}@${HOST}" "mkdir -p /var/www/chat-app/downloads"
          
          echo "Uploading APK with fallback strategies..."
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$APK_PATH" "${USER}@${HOST}:/var/www/chat-app/downloads/ichat.apk" || \
          rsync -avz -e "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" "$APK_PATH" "${USER}@${HOST}:/var/www/chat-app/downloads/ichat.apk" || \
          (base64 -w 0 "$APK_PATH" | sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${USER}@${HOST}" "base64 -d > /var/www/chat-app/downloads/ichat.apk")
          
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${USER}@${HOST}" "chmod 644 /var/www/chat-app/downloads/ichat.apk && ls -lh /var/www/chat-app/downloads/ichat.apk"
          echo "🎉 APK published to https://chat.on-excapp.app/download/ichat.apk"
